name: CI

# Runs on every pull request and on pushes to main.
# To block merging on failures: GitHub → Settings → Branches → add a rule for `main`,
# tick "Require status checks to pass", and select the three jobs below.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

# Placeholder values so the app builds and serves. They are NOT secrets and point at nothing
# real; CI never talks to the production or staging Supabase projects. They are set only on
# the build/e2e steps: unit tests must run with no Supabase configured (offline fallbacks).

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # No Supabase backend on purpose: these tests check public pages and that every
      # private page / API refuses anonymous visitors.
      - name: Run Playwright
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database:
    name: Migrations + RLS tests (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Start local Supabase (applies migrations 0001+ and seed.sql)
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,postgres-meta
      # The RLS test files create their own fixtures (same IDs as seed.sql), so they need
      # an empty database. `supabase start` above already proved migrations + seed load.
      - name: Reset database without seed data
        run: supabase db reset --local --no-seed
      - name: Run RLS tests
        run: |
          set -euo pipefail
          db_container="supabase_db_$(grep -m1 '^project_id' supabase/config.toml | cut -d'"' -f2)"
          for f in supabase/tests/*.sql; do
            echo "::group::$f"
            docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -q < "$f"
            echo "::endgroup::"
          done
      - name: Database advisors (lint)
        run: supabase db lint --level error
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
